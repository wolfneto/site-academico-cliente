<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" href="<%= BASE_URL %>favicon.ico" />
    <title>Acadêmico Solident</title>
    <!-- Scripts externos -->
    <script src="https://js.braintreegateway.com/web/dropin/1.44.0/js/dropin.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.2.1.min.js" crossorigin="anonymous"></script>
  </head>

  <body onload="msieversion()">
    <noscript>
      <strong
        >We're sorry but Acadêmico Solident doesn't work properly without
        JavaScript enabled. Please enable it to continue.</strong
      >
    </noscript>
    <script>
      function msieversion() {
        var ua = window.navigator.userAgent;
        var msie = ua.indexOf("MSIE ");

        if (msie > 0 || !!navigator.userAgent.match(/Trident.*rv\:11\./)) {
          // If Internet Explorer, return version number
          document.getElementById("IE").innerHTML =
            "Navegador não suportado, utilize o Google Chrome.";
        } // If another browser, return 0

        return false;
      }
    </script>
    <h1 style="margin:0px" id="IE"></h1>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
