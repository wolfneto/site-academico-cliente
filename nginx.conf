server {
    listen 80;
    server_name academicosolident.com.br www.academicosolident.com.br;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name academicosolident.com.br www.academicosolident.com.br;
    
    ssl_certificate /etc/letsencrypt/live/academicosolident.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academicosolident.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}