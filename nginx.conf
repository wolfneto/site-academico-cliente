server {
    listen 80;
    server_name academicosolident.com.br www.academicosolident.com.br;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name academicosolident.com.br www.academicosolident.com.br;

    ssl_certificate /etc/letsencrypt/live/academicosolident.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/academicosolident.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    client_max_body_size 50m;

    # gzip compression for proxied and static content
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/javascript+xml text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    root /usr/share/nginx/html;
    index index.html;

    resolver 10.89.0.1 ipv6=off valid=10s;

    set $site_academico_servidor site-academico-servidor;
    set $cris_servidor cris-servidor;
    set $cris_cliente cris-cliente;
    set $link_pagamento_servidor link-pagamento-servidor;
    set $link_pagamento_cliente link-pagamento-cliente;

    # === Site Academico (SPA principal) ===
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$site_academico_servidor:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # === ERP (cris-cliente + cris-servidor) ===
    location /erp/api/ {
        rewrite ^/erp/api/(.*) /$1 break;
        proxy_pass http://$cris_servidor:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /erp/ {
        rewrite ^/erp/(.*) /$1 break;
        proxy_pass http://$cris_cliente:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;
    }

    # === Link Pagamento (link-pagamento-cliente + link-pagamento-servidor) ===
    location /link/api/ {
        rewrite ^/link/api/(.*) /$1 break;
        proxy_pass http://$link_pagamento_servidor:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /link/ {
        rewrite ^/link/(.*) /$1 break;
        proxy_pass http://$link_pagamento_cliente:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 60s;
    }

    # === Pagamento API (compatibilidade — chamado pelo site academico) ===
    location /pagamento/ {
        rewrite ^/pagamento/(.*) /$1 break;
        proxy_pass http://$link_pagamento_servidor:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # === Socket.io — Pagamento ===
    location /solident/pagamento/socket.io/ {
        rewrite ^/solident/pagamento/socket.io/(.*) /socket.io/$1 break;
        proxy_pass http://$link_pagamento_servidor:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # === Socket.io — Site Academico ===
    location /socket.io/ {
        proxy_pass http://$site_academico_servidor:3002/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # === SPA fallback — Site Academico ===
    location / {
        try_files $uri $uri/ /index.html;
    }
}
